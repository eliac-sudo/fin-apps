*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:13.5px/1.5 var(--body);background:var(--pattern),var(--page)}

nav{display:flex;gap:2px}

nav button:focus-visible,.tile:focus-visible,button:focus-visible,summary:focus-visible,th:focus-visible{outline:2px solid var(--ui2);outline-offset:2px}
.search{position:relative;flex:1;max-width:300px;margin-left:auto}
.search input{padding:5px 12px;border-radius:0;background:var(--field);border:1px solid var(--ui2);font:12.5px var(--mono);width:100%;color:var(--ui2)}.search input::placeholder{color:var(--muted)}
.sugg{position:absolute;top:34px;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 22px rgba(0,0,0,.35);padding:4px;display:none;max-height:320px;overflow:auto}
.sugg button{all:unset;display:block;width:100%;box-sizing:border-box;padding:6px 10px;border-radius:7px;cursor:pointer}.sugg button:hover,.sugg button.on{background:var(--surface2)}
.meta{color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.ghost{all:unset;cursor:pointer;color:var(--ink2);padding:4px 8px;border-radius:7px}.ghost:hover{background:var(--surface2)}
main{max-width:var(--main);margin:0 auto;padding:14px 28px 60px}
h2{font:700 16px var(--head);margin:0;letter-spacing:.09em;text-transform:uppercase;color:var(--title)}
h3{font:600 13.5px var(--head);margin:0;letter-spacing:.05em;color:var(--ui2);text-transform:uppercase}
.sub{color:var(--muted);font-size:12.5px;margin:3px 0 10px;max-width:840px}
.hero{font:700 25px/1.18 var(--head);margin:8px 0 3px;max-width:1040px;letter-spacing:.02em;text-shadow:var(--hero-shadow)}
.card{background:var(--surface);border:1px solid var(--border);padding:14px 16px;clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.grid{display:grid;gap:10px}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
section{margin-top:14px}
.big{font:700 31px/1.05 var(--head);letter-spacing:.02em}
.mid{font:700 17px/1.25 var(--head);letter-spacing:.03em}
.small{font-size:12.5px;color:var(--ink2)}
.tiny{font-size:11.5px;color:var(--muted)}
.muted{color:var(--muted)}
.gauge{position:relative;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--crit),var(--muted) 50%,var(--good));margin:9px 0 7px}
.gauge i{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:var(--ink);border:2px solid var(--surface);transform:translate(-50%,-50%)}
.link{cursor:pointer}.link:hover{border-color:var(--axis)}
.go{color:var(--y);font:600 12.5px var(--head);letter-spacing:.06em;margin-top:6px;display:block;text-transform:uppercase}
.mapgroup{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:start;margin-top:7px}
.mapgroup b{padding-top:9px;font-size:12.5px;color:var(--ink2);font-weight:500}
.tiles{display:flex;flex-wrap:wrap;gap:3px}
.tile{all:unset;cursor:pointer;width:122px;height:60px;padding:6px 9px;clip-path:var(--clip-card);border-radius:var(--radius);box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
.tile:hover{filter:brightness(1.15)}

.legend{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:12px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.legend i.line{height:2px;width:14px;vertical-align:3px}
.strip{display:grid;grid-template-columns:82px 1fr 56px;gap:10px;align-items:center;height:24px;font-size:12.5px;cursor:pointer;border-radius:5px}
.strip:hover{background:var(--surface2)}

.strip .track{background:linear-gradient(90deg,var(--good),var(--axis) 50%,var(--crit));height:3px}.strip .track i{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;background:var(--ink);border:2px solid var(--surface);transform:translate(-50%,-50%)}
.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12px}

.chip[aria-pressed=true]{background:var(--ui2);color:var(--on-ui2);font-weight:700}
.tag{display:inline-block;padding:1px 8px;background:var(--surface2);font-size:11.5px;color:var(--ink2);white-space:nowrap}
.tag.cheap{background:var(--good);color:var(--on-good);font-weight:650}.tag.dear{background:var(--crit);color:#fff;font-weight:650}
.trend{white-space:nowrap;font-weight:600}.trend.up{color:var(--good)}.trend.down{color:var(--crit)}.trend.side{color:var(--muted)}
ul.plain{margin:6px 0 0;padding:0 0 0 16px;color:var(--ink2);font-size:13px}ul.plain li{margin:4px 0}
.bar{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;height:26px;font-size:12.5px}
.bar .t{position:relative;height:9px}
.bar .t u{position:absolute;left:0;top:0;bottom:0;background:var(--s1);border-radius:0 3px 3px 0}
.bar .t s{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--muted)}
.stack{display:flex;gap:2px;height:9px;min-width:120px}
.stack i{display:block;height:100%}.stack i:first-child{border-radius:3px 0 0 3px}.stack i:last-child{border-radius:0 3px 3px 0}
a{color:var(--ui2)}
details>summary{cursor:pointer;color:var(--ink2);font-size:12.5px;list-style:none;display:inline-flex;gap:5px;align-items:center}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"›";font-size:15px;line-height:1;transition:transform .12s}
details[open]>summary::before{transform:rotate(90deg)}
.row{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start;padding:10px 2px;border-top:1px solid var(--grid)}
.row:first-child{border-top:0}
.row .ic{font-size:15px;line-height:1.35}
.text{font-size:12.5px;color:var(--ink2);border-top:1px solid var(--grid);padding:7px 0}
.tw{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:left;color:var(--ui2);font:600 12.5px var(--head);letter-spacing:.05em;text-transform:uppercase;padding:4px 7px;border-bottom:1px solid var(--axis);white-space:nowrap;background:var(--surface);position:sticky;top:0}
th.sort{cursor:pointer;user-select:none}th.sort:hover{color:var(--title)}th.sort[aria-sort]{color:var(--title);font-weight:700}
td{padding:3px 7px;border-bottom:1px solid var(--grid);white-space:nowrap}
td.wrap{white-space:normal}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12px}
tr.click{cursor:pointer}tr.click:hover,tr.on{background:var(--surface2)}
label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--ink2)}
input,select{background:var(--surface2);color:var(--ink);border:1px solid transparent;border-radius:0;padding:7px 10px;font:inherit;width:100%}
input:focus,select:focus{outline:1px solid var(--y)}
.primary{background:var(--y);color:var(--on-y);border:0;padding:8px 18px;cursor:pointer;font:700 15px var(--head);letter-spacing:.1em;text-transform:uppercase;width:100%;clip-path:var(--clip-tab);border-radius:var(--tab-radius)}
.btn{background:transparent;color:var(--y);border:1px solid var(--y);padding:3px 10px;cursor:pointer;font:600 13px var(--head);letter-spacing:.04em}.btn:hover{background:var(--y);color:var(--on-y)}
.notice{border-left:3px solid var(--warn);padding:6px 10px;background:var(--surface2);border-radius:0 7px 7px 0;font-size:12.5px;margin:6px 0}
.notice.bad{border-color:var(--crit)}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:0 6px 18px rgba(0,0,0,.3);display:none;max-width:290px}
.tip strong{display:block;font-size:13.5px}
.tip em{display:inline-block;width:12px;height:2px;margin-right:5px;vertical-align:3px}
.heroCard{background:linear-gradient(100deg,color-mix(in srgb,var(--y) 12%,transparent),color-mix(in srgb,var(--s1) 5%,transparent) 45%,color-mix(in srgb,var(--h4) 11%,transparent)),var(--hero);border:1px solid var(--y);border-left:6px solid var(--y);clip-path:var(--clip-card);border-radius:var(--radius);padding:16px 20px;display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:18px;align-items:center;margin-top:6px}
.brief{list-style:none;margin:8px 0 0;padding:0;font-size:13.5px}.brief li{display:flex;gap:8px;margin:4px 0;align-items:baseline}.brief b.dot{flex:none}
.pos{color:var(--good);font-weight:650}.neg{color:var(--crit);font-weight:650}
.chipv{display:inline-block;padding:0 8px;font:700 12.5px var(--head);letter-spacing:.04em;white-space:nowrap}
.ztag{display:inline-block;min-width:38px;text-align:center;padding:0 7px;font:800 13px/1.45 var(--head);letter-spacing:.09em;clip-path:var(--clip-tab);border-radius:var(--tab-radius)}
.ztag.BYZ{background:var(--good);color:var(--on-good);box-shadow:var(--tile-glow)}.ztag.SZT{background:var(--h4);color:#fff}.ztag.NTR{color:var(--muted);background:var(--surface2)}.ztag.mini{min-width:30px;font-size:11.5px;padding:0 4px}
.zbar{position:relative;width:96px;height:8px;background:var(--surface2)}.zbar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}.zbar i{position:absolute;top:0;bottom:0}
.cl{position:relative;overflow:hidden;padding:11px 13px 10px}.cl .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.tlabel{font:700 13px var(--head);color:var(--ui2);text-transform:uppercase;letter-spacing:.07em}
.tcell{all:unset;cursor:pointer;display:block;box-sizing:border-box;border-radius:9px;padding:9px 11px;min-height:64px;text-align:left}.tcell:hover{filter:brightness(1.15)}
.tcell:focus-visible{outline:2px solid var(--ui2)}
.hbar{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:center;height:22px;font-size:12.5px;cursor:pointer;border-radius:5px}.hbar:hover{background:var(--surface2)}
.hbar .w{position:relative;height:12px}.hbar .w i{position:absolute;top:0;bottom:0;border-radius:3px}.hbar .w s{position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--axis)}
.hbar .w em{position:absolute;top:-2px;font-style:normal;font-size:11.5px;color:var(--ink)}

    ["Call e put","La call dà il diritto di comprare: guadagna se il prezzo sale. La put dà il diritto di vendere: guadagna se il prezzo scende, e funziona come un'assicurazione.","Si possono comprare per scommettere su una direzione, o per proteggere una posizione che hai già.",c?"Un contratto di questo mercato: "+c.code+" è una "+c.type+".":null],
    ["Strike","Il prezzo fissato nel contratto: il livello a cui puoi comprare (call) o vendere (put).","Più è lontano dal prezzo attuale, meno costa l'opzione e meno è probabile che finisca in guadagno.",c?nm+" vale "+price(r.spot)+", questa "+c.type+" ha strike "+price(c.strike)+".":null],

    ["Dentro, fuori e ai soldi","Ai soldi: lo strike è vicino al prezzo. Dentro i soldi: esercitarla oggi darebbe già un guadagno. Fuori dai soldi: oggi non darebbe nulla, vale solo per quello che può succedere.","Il modello usa solo opzioni fuori dai soldi, perché i loro prezzi sono i più puliti.",null]]],
  ["Leggere un prezzo",[

    ["Spread","La distanza tra bid e ask, in percentuale del prezzo medio. È un costo: comprando e rivendendo subito la perdi tutta.","Più è stretto, meglio è. Nelle liste entrano solo contratti sotto il 25%.",c?"Su questo contratto è il "+fmt(c.spread_pct,1)+"%.":null],
    ["OI, contratti aperti","Quanti contratti esistono in quel momento, non ancora chiusi.","Misura la liquidità e serve a stimare la gamma. Con pochi contratti aperti può essere difficile uscire a un buon prezzo.",c?"Su questo contratto sono "+fmt(c.oi)+".":null],
    ["Volume","Quanti contratti sono passati di mano oggi.","L'OI dice quanto interesse c'è, il volume quanto è attivo adesso.",null]]],

    ["Volatilità prevista","Quanto il nostro modello HAR si aspetta che il mercato si muova fino alla scadenza.","È il riferimento di questa pagina: il suo confronto con l'attesa decide se le opzioni sono care o economiche.",n.forecast?"Su "+nm+" è il "+fmt(n.forecast*100)+"% annuo.":null],

    ["Movimento atteso","Quanto il mercato sconta che il prezzo si sposti entro la scadenza, in più o in meno. Si ricava dal costo di una call più una put ai soldi.","Se pensi che il movimento sarà più grande, comprare ha senso; se pensi sarà più piccolo, l'opzione è cara per te.",n.move_pct?"Entro il "+short(n.expiry)+": ±"+fmt(n.move_pct,1)+"%.":null],

    ["Punti di volatilità","La differenza tra due volatilità: se il modello dice 40% e il prezzo sconta 35%, lo scarto è 5 punti.","Serve a confrontare contratti diversi, perché lo scarto in percentuale esplode sulle opzioni molto economiche.",c&&c.gap_vol!=null?"Su "+c.code+" lo scarto è "+fmt(c.gap_vol,1)+" punti.":null]]],
