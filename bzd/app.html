*{box-sizing:border-box}

.mood{display:grid;grid-template-columns:110px minmax(0,1fr) 150px;gap:8px;align-items:center;margin:4px 0}
.studytbl td.wrap{white-space:normal;min-width:160px}
.zbar{position:relative;width:96px;height:8px;background:var(--surface2)}.zbar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}.zbar i{position:absolute;top:0;bottom:0}
.cl{position:relative;overflow:hidden;padding:11px 13px 10px}.cl .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.tlabel{font:700 13px var(--head);color:var(--ui2);text-transform:uppercase;letter-spacing:.07em}
.tcell{all:unset;cursor:pointer;display:block;box-sizing:border-box;border-radius:9px;padding:9px 11px;min-height:64px;text-align:left}.tcell:hover{filter:brightness(1.15)}
.tcell:focus-visible{outline:2px solid var(--ui2)}
.hbar{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:center;height:22px;font-size:12.5px;cursor:pointer;border-radius:5px}.hbar:hover{background:var(--surface2)}
.hbar .w{position:relative;height:12px}.hbar .w i{position:absolute;top:0;bottom:0;border-radius:3px}.hbar .w s{position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--axis)}
.hbar .w em{position:absolute;top:-2px;font-style:normal;font-size:11.5px;color:var(--ink)}
dialog{background:var(--surface);color:var(--ink);border:1px solid var(--y);padding:18px;width:min(760px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0}.kv div b{display:block;font-size:15px;font-weight:620}.kv div span{font-size:11.5px;color:var(--muted)}
svg text{font:10.5px var(--mono);fill:var(--muted)}
.seg{display:inline-flex;gap:2px;background:var(--surface2);padding:2px}.seg button{all:unset;cursor:pointer;padding:2px 11px;font:600 13px var(--head);letter-spacing:.05em;color:var(--ink2)}.seg button[aria-pressed=true]{background:var(--ui2);color:var(--on-ui2);font-weight:700}
.ladder{position:relative;height:76px;margin:14px 6px 4px}
.ladder .rail{position:absolute;left:0;right:0;top:34px;height:8px;border-radius:4px;display:flex;gap:2px}
.ladder .rail i{display:block;height:100%}
.ladder .pt{position:absolute;top:0;transform:translateX(-50%);text-align:center;white-space:nowrap;font-size:11.5px;color:var(--ink2)}
.ladder .pt b{display:block;color:var(--ink);font-size:13px}
.ladder .under{position:absolute;top:47px;transform:translateX(-50%);text-align:center;white-space:nowrap;font-size:11.5px;color:var(--ink2)}
.foot{margin-top:22px;color:var(--muted);font-size:11.5px}
.glitch:hover{animation:glitch .35s steps(2) 1}
@keyframes glitch{0%{transform:translate(0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,0)}100%{transform:translate(0)}}
@media (prefers-reduced-motion:reduce){.glitch:hover{animation:none}}
@media (max-width:1100px){.g5,.g4{grid-template-columns:repeat(3,minmax(0,1fr))}.g3,.g2{grid-template-columns:1fr}}
.themebox{position:relative}
.themes{position:absolute;top:calc(100% + 8px);right:0;z-index:40;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:6px;width:286px;display:none;box-shadow:0 10px 26px rgba(0,0,0,.5);white-space:normal}
.themes.open{display:block}.themes button{all:unset;display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;width:100%;box-sizing:border-box;padding:7px 8px;cursor:pointer}.themes button:hover,.themes button[aria-pressed=true]{background:var(--surface2)}.themes button:focus-visible{outline:2px solid var(--ui2)}
.swatch{display:flex;height:22px;border:1px solid var(--axis)}.swatch i{flex:1}.themes b{display:block;font-size:13px;color:var(--ink)}.themes small{display:block;color:var(--muted);font-size:11.5px;line-height:1.3}
.bands{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:12px}.bands div{border-top:4px solid;padding:5px 2px 0;font-size:11.5px;color:var(--ink2);line-height:1.35}.bands b{display:block;color:var(--ink);font-size:12.5px}
.scale{position:relative;display:flex;gap:2px;height:10px;margin:18px 0 22px}.scale i{flex:1}.scale u{position:absolute;top:-5px;width:4px;height:20px;background:var(--ink);transform:translateX(-50%);outline:2px solid var(--surface)}.scale span{position:absolute;top:14px;font-size:10.5px;color:var(--muted);transform:translateX(-50%)}
.factor{display:grid;grid-template-columns:150px 110px 34px 1fr;gap:10px;align-items:center;padding:5px 0;border-top:1px solid var(--grid);font-size:12.5px}.factor .m{position:relative;height:8px;background:var(--surface2)}.factor .m i{position:absolute;top:0;bottom:0;left:0}.factor .m s{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted)}
.lead{font-size:14px;line-height:1.5;margin:8px 0}.hint{font-size:12px;color:var(--ink2);border-left:2px solid var(--axis);padding:3px 0 3px 9px;margin:7px 0 0;line-height:1.45}
.terms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}.term{background:var(--surface2);padding:9px 11px;border-radius:var(--radius);font-size:12.5px;line-height:1.45}.term b{display:block;font-size:13.5px;color:var(--ink);margin-bottom:2px}.term p{margin:0;color:var(--ink2)}.term .why{margin-top:4px}.term .now{margin-top:5px;padding-top:4px;border-top:1px solid var(--axis);color:var(--ink);font-size:12px}
.gtitle{margin:12px 0 0;font:600 14px var(--head);letter-spacing:.04em;color:var(--ink);cursor:pointer}
.steps{list-style:none;counter-reset:s;margin:10px 0 0;padding:0}.steps>li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--grid)}.steps>li::before{content:counter(s);width:24px;height:24px;display:grid;place-items:center;background:var(--y);color:var(--on-y);font:700 13px var(--head)}.steps h4{margin:0;font-size:13.5px}.steps p{margin:2px 0;color:var(--ink2);font-size:12.5px;line-height:1.5}
.formula{font:12px/1.6 var(--mono);background:var(--page);border-left:2px solid var(--ui2);padding:5px 10px;margin:5px 0;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.pricebar{position:relative;height:50px;margin:14px 12px 4px}.pricebar .line{position:absolute;left:0;right:0;top:22px;height:2px;background:var(--axis)}.pricebar .q{position:absolute;top:0;transform:translateX(-50%);text-align:center;font-size:11px;color:var(--ink2);white-space:nowrap}.pricebar .q b{display:block;color:var(--ink);font-size:12.5px}.pricebar .q i{display:block;width:3px;height:14px;margin:1px auto 0}
.modelsum{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:center}
.selectline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}.selectline select{width:auto;min-width:190px;padding:4px 8px}
@media (max-width:1100px){html[data-theme=kangtao] body{padding-left:0}html[data-theme=kangtao] header{position:sticky;width:auto;bottom:auto;flex-direction:row;flex-wrap:wrap}html[data-theme=kangtao] nav{flex-direction:row}.terms,.modelsum{grid-template-columns:1fr}.bands{grid-template-columns:repeat(2,minmax(0,1fr))}.factor{grid-template-columns:120px 80px 30px 1fr}}

/* ---- fonts served by the app (OFL) ---- */
@font-face{font-family:"Orbitron";src:url(/fonts/Orbitron.ttf) format("truetype");font-weight:400 900;font-display:swap}
@font-face{font-family:"Rajdhani";src:url(/fonts/Rajdhani-Medium.ttf) format("truetype");font-weight:500;font-display:swap}
@font-face{font-family:"Rajdhani";src:url(/fonts/Rajdhani-SemiBold.ttf) format("truetype");font-weight:600 700;font-display:swap}
@font-face{font-family:"Share Tech Mono";src:url(/fonts/ShareTechMono.ttf) format("truetype");font-display:swap}

/* ---- Arasaka: corporate HUD, black glass and red light ---- */
html[data-theme=arasaka]{--page:#030304;--surface:rgba(16,16,20,.74);--surface2:rgba(44,44,52,.6);--solid:#0d0d10;--border:rgba(232,17,45,.30);--grid:rgba(255,255,255,.06);--axis:rgba(255,255,255,.18);
  --ink:#f4f1ec;--ink2:#cfcac4;--muted:#8f8a86;--y:#ff1a3c;--glow:rgba(255,26,60,.55);--glow2:rgba(255,26,60,.18);--steel:#9fb3c8;
  --head:"Orbitron","Rajdhani","Bahnschrift",system-ui,sans-serif;--body:"Rajdhani","Segoe UI",system-ui,sans-serif;--mono:"Share Tech Mono",ui-monospace,"Consolas",monospace;
  --pattern:radial-gradient(1100px 520px at 12% -12%,rgba(255,26,60,.17),transparent 62%),radial-gradient(800px 700px at 112% 38%,rgba(255,26,60,.07),transparent 60%),
    linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px) 0 0/100% 46px,linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px) 0 0/46px 100%;
  --hero:rgba(26,6,10,.70);--scan:.10}
html[data-theme=arasaka] body{font-size:15px;letter-spacing:.01em;background-attachment:fixed}
html[data-theme=arasaka] body::before{content:"";position:fixed;left:0;right:0;top:-30vh;height:30vh;pointer-events:none;z-index:31;
  background:linear-gradient(180deg,transparent,rgba(255,26,60,.03) 70%,rgba(255,26,60,.09) 99%,transparent);animation:ar-sweep 9s linear infinite}
@keyframes ar-sweep{to{transform:translateY(160vh)}}
html[data-theme=arasaka] ::selection{background:var(--y);color:#fff}
html[data-theme=arasaka] *{scrollbar-width:thin;scrollbar-color:rgba(255,26,60,.55) transparent}

html[data-theme=arasaka] header{background:linear-gradient(180deg,rgba(3,3,4,.92),rgba(3,3,4,.72));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,26,60,.55);box-shadow:0 1px 0 rgba(255,26,60,.15),0 6px 22px -16px var(--glow)}
html[data-theme=arasaka] h1{font-family:"Orbitron",var(--head);font-weight:800;letter-spacing:.5em;text-shadow:0 0 14px var(--glow),2px 0 rgba(0,229,255,.35),-2px 0 rgba(255,26,60,.6);animation:ar-flicker 7s infinite}
@keyframes ar-flicker{0%,92%,100%{opacity:1}93%{opacity:.55}94%{opacity:1}96%{opacity:.75}97%{opacity:1}}
html[data-theme=arasaka] nav button{font:600 10px "Orbitron",var(--head);letter-spacing:.16em;color:var(--muted);padding:7px 9px;border-bottom:1px solid transparent;transition:color .2s,text-shadow .2s}
html[data-theme=arasaka] nav button:hover{color:var(--ink);text-shadow:0 0 10px var(--glow)}
html[data-theme=arasaka] nav button[aria-selected=true]{color:#fff;border-bottom:1px solid var(--y);text-shadow:0 0 12px var(--glow);box-shadow:0 8px 14px -10px var(--y)}
html[data-theme=arasaka] nav button[aria-selected=true]::before{content:"▸ ";color:var(--y)}
html[data-theme=arasaka] .search{min-width:150px}
html[data-theme=arasaka] .search input{background:rgba(0,0,0,.5);border:1px solid rgba(255,26,60,.45);color:var(--ink);font-family:var(--mono);letter-spacing:.06em;box-shadow:inset 0 0 12px rgba(255,26,60,.12)}
html[data-theme=arasaka] .search input:focus{outline:none;border-color:var(--y);box-shadow:0 0 0 1px var(--y),0 0 16px var(--glow)}

html[data-theme=arasaka] main{counter-reset:ar-sec}
html[data-theme=arasaka] .card{position:relative;padding:18px 20px;border:1px solid rgba(255,255,255,.07);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%);
  background:linear-gradient(var(--y),var(--y)) 0 0/16px 1px no-repeat,linear-gradient(var(--y),var(--y)) 0 0/1px 16px no-repeat,
    linear-gradient(var(--y),var(--y)) 100% 100%/16px 1px no-repeat,linear-gradient(var(--y),var(--y)) 100% 100%/1px 16px no-repeat,
    linear-gradient(225deg,rgba(255,26,60,.55) 0 11px,transparent 11px) 100% 0/16px 16px no-repeat,
    linear-gradient(180deg,rgba(30,30,36,.80),rgba(10,10,13,.82));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 20px 46px -20px rgba(0,0,0,.9)}
html[data-theme=arasaka] section.card{counter-increment:ar-sec}
html[data-theme=arasaka] section.card>h2::before,html[data-theme=arasaka] section.card>.selectline>h2::before{content:"// " counter(ar-sec,decimal-leading-zero) "  ";color:var(--y);text-shadow:0 0 10px var(--glow)}
html[data-theme=arasaka] h2{font:600 12px "Orbitron",var(--head);letter-spacing:.26em;color:var(--ink)}
html[data-theme=arasaka] h3{font:600 10.5px "Orbitron",var(--head);letter-spacing:.2em;color:var(--steel)}
html[data-theme=arasaka] .sub,html[data-theme=arasaka] .small{font-size:14px}
html[data-theme=arasaka] .tiny{font-size:12.5px}

html[data-theme=arasaka] .heroCard{position:relative;overflow:hidden;border:1px solid rgba(255,26,60,.35);border-left:3px solid var(--y);padding:26px 30px;
  background:linear-gradient(105deg,rgba(255,26,60,.16),rgba(255,26,60,.02) 42%,rgba(159,179,200,.05)),var(--hero);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 40px -12px var(--glow),inset 0 0 60px -30px var(--glow)}
html[data-theme=arasaka] .heroCard::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.07) 45%,transparent 60%);transform:translateX(-100%);animation:ar-sheen 7s ease-in-out infinite}
@keyframes ar-sheen{60%,100%{transform:translateX(100%)}}
html[data-theme=arasaka] .heroCard::before{content:"ARASAKA // QUADRO DEI MERCATI · LIVE";position:absolute;top:8px;right:14px;font:500 9.5px var(--mono);letter-spacing:.3em;color:var(--y);opacity:.8}
html[data-theme=arasaka] .hero{font:500 21px/1.38 "Orbitron",var(--head);letter-spacing:.015em;text-shadow:0 0 22px rgba(255,26,60,.28)}
html[data-theme=arasaka] .big{font:500 30px/1.05 "Orbitron",var(--head);text-shadow:0 0 16px rgba(255,255,255,.18)}
html[data-theme=arasaka] .mid{font:600 15px/1.25 "Orbitron",var(--head);letter-spacing:.05em}

html[data-theme=arasaka] .num,html[data-theme=arasaka] td.num{font-family:var(--mono);font-size:13.5px;letter-spacing:.02em}
html[data-theme=arasaka] table{font-size:14px}
html[data-theme=arasaka] th{background:var(--solid);font:600 9.5px "Orbitron",var(--head);letter-spacing:.2em;color:var(--muted);border-bottom:1px solid rgba(255,26,60,.4)}
html[data-theme=arasaka] th.num{font:600 9.5px "Orbitron",var(--head);letter-spacing:.2em}
html[data-theme=arasaka] th.sort:hover,html[data-theme=arasaka] th.sort[aria-sort]{color:#fff;text-shadow:0 0 8px var(--glow)}
html[data-theme=arasaka] td{border-bottom:1px solid rgba(255,255,255,.05)}
html[data-theme=arasaka] tbody tr{transition:background .15s}
html[data-theme=arasaka] tbody tr:hover td{background:rgba(255,26,60,.07)}
html[data-theme=arasaka] tbody tr:hover td:first-child{box-shadow:inset 2px 0 0 var(--y)}

html[data-theme=arasaka] .chip{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);font:600 10.5px "Orbitron",var(--head);letter-spacing:.16em;color:var(--ink2);padding:5px 12px}
html[data-theme=arasaka] .chip:hover{border-color:rgba(255,26,60,.6);color:#fff}
html[data-theme=arasaka] .chip[aria-pressed=true]{background:rgba(255,26,60,.2);border-color:var(--y);color:#fff;box-shadow:0 0 14px -2px var(--glow),inset 0 0 10px rgba(255,26,60,.25)}
html[data-theme=arasaka] .seg button[aria-pressed=true]{box-shadow:0 0 12px -2px var(--glow)}
html[data-theme=arasaka] .tag{font-family:var(--mono);letter-spacing:.06em;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04)}
html[data-theme=arasaka] .tag.cheap{background:rgba(53,214,154,.16);color:#6fffc4;border-color:rgba(53,214,154,.6);box-shadow:0 0 10px -2px rgba(53,214,154,.55)}
html[data-theme=arasaka] .tag.dear{background:rgba(255,26,60,.18);color:#ff8597;border-color:rgba(255,26,60,.7);box-shadow:0 0 10px -2px var(--glow)}
html[data-theme=arasaka] .gauge{height:3px;box-shadow:0 0 12px rgba(255,26,60,.35)}
html[data-theme=arasaka] .gauge i{background:#fff;box-shadow:0 0 10px #fff,0 0 18px var(--glow)}
html[data-theme=arasaka] .tile{border:1px solid rgba(255,255,255,.08);transition:transform .15s,box-shadow .15s}
html[data-theme=arasaka] .tile:hover{transform:translateY(-1px);box-shadow:0 0 16px -4px var(--glow);filter:brightness(1.2)}
html[data-theme=arasaka] .notice{border-left:2px solid var(--y);background:rgba(255,26,60,.07)}
html[data-theme=arasaka] a{color:#ff8597}
html[data-theme=arasaka] details>summary::before{color:var(--y)}
html[data-theme=arasaka] .ghost,html[data-theme=arasaka] .btn{font-family:"Orbitron",var(--head);font-size:10.5px;letter-spacing:.16em}

@media (prefers-reduced-motion:reduce){html[data-theme=arasaka] body::before,html[data-theme=arasaka] .heroCard::after,html[data-theme=arasaka] h1{animation:none!important}}

/* ---- the other layouts: the same HUD ideas, lighter, in their own colours ---- */
html:not([data-theme]),html[data-theme=bzd],html[data-theme=militech],html[data-theme=kangtao]{--mono:"Share Tech Mono",ui-monospace,"Cascadia Mono","Consolas",monospace}

html:not([data-theme]) section.card>h2::before,html[data-theme=bzd] section.card>h2::before,html:not([data-theme]) section.card>.selectline>h2::before,html[data-theme=bzd] section.card>.selectline>h2::before{content:"> " counter(hud-sec,decimal-leading-zero) " ";color:var(--ui2);text-shadow:0 0 8px var(--ui2)}
html[data-theme=militech] section.card>h2::before,html[data-theme=militech] section.card>.selectline>h2::before{content:"▮ " counter(hud-sec,decimal-leading-zero) " · "}
html:not([data-theme]) nav button[aria-selected=true],html[data-theme=bzd] nav button[aria-selected=true]{box-shadow:0 0 18px -2px var(--y)}

html[data-theme=militech] nav button[aria-selected=true]{text-shadow:0 0 10px rgba(255,122,26,.7)}
html[data-theme=kangtao] .card{background:linear-gradient(160deg,rgba(82,220,199,.07),rgba(11,28,26,.6) 40%),rgba(11,28,26,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 16px 40px -22px rgba(0,0,0,.9)}

html[data-theme=kangtao] h2{text-shadow:0 0 12px rgba(224,181,74,.35)}
html[data-theme=kangtao] tbody tr:hover td{background:rgba(82,220,199,.07)}
html[data-theme=kangtao] nav button[aria-selected=true]{box-shadow:0 0 16px -4px var(--ui2)}
.wgraph{display:block;margin-top:6px}.wgraph text{font:12px var(--body,sans-serif);fill:var(--ink)}.wgraph .wcolhead{font:700 11px var(--head);letter-spacing:.14em}
.wnode{cursor:pointer}.wnode rect{fill:var(--surface2);stroke-width:1}.wnode:hover rect,.wnode.on rect{fill:color-mix(in srgb,var(--y) 18%,var(--surface2))}.wnode.dim{opacity:.3}

.wlayout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px;align-items:start;margin-top:14px}
.windex{position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto;padding-right:4px}.windex input{width:100%;margin-bottom:8px}
.wlabel{font:700 11px var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.wi{all:unset;cursor:pointer;display:block;padding:3px 8px;font-size:13px;color:var(--ink2);border-left:2px solid transparent}.wi:hover{color:var(--ink)}.wi.on{color:var(--ink);border-left-color:var(--y);background:var(--surface2)}
.whead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.wkind{font:700 11px var(--head);letter-spacing:.12em;text-transform:uppercase;border:1px solid;padding:1px 7px}.wstatus{font-size:12px;color:var(--ink2)}
